name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  id-token: write # the OIDC token npm exchanges for publish rights (trusted publishing)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # npm's own trusted-publishing example: Node 24 ships an npm that does the OIDC exchange
      # (>= 11.5.1), so nothing is upgraded here. No token anywhere — the trusted publisher on
      # npmjs.com (this repo, this workflow filename) is the only publish right.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: npm new enough for trusted publishing
        run: |
          V="$(npm --version)"
          echo "npm $V"
          node -e "
            const [a,b,c] = process.argv[1].split('.').map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error('::error::npm ' + process.argv[1] + ' is too old; trusted publishing needs >= 11.5.1'); process.exit(1); }
          " "$V"

      - run: npm ci

      # The tag is the only trigger, so a tag that disagrees with package.json would
      # publish a version nobody asked for. Fail before anything is built.
      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      # Regenerating must be a no-op. If it isn't, the committed client disagrees with
      # the committed spec and the tarball would not be what was reviewed.
      - name: Generated client is in sync with openapi.json
        run: npm run verify:generated

      - run: npm run typecheck
      - run: npm run build
      - run: npm publish --access public
